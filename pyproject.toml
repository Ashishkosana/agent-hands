[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hands"
version = "0.1.0"
description = "Record-once / replay-many computer-use automation: an LLM discovers a UI flow once; a typed capability artifact replays it deterministically with no model in the loop."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Ashish Kosana", email = "ashishkosana@gmail.com" }]
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.10",
    "openai>=1.50",  # client for any OpenAI-compatible endpoint; Groq-hosted model by default
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hands = "hands.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Demo-driver surfaces: the dashboard embeds HTML/CSS templates and the chatbot
# embeds prompt/tool literals; line-length does not apply meaningfully there.
"dashboard/*" = ["E501"]
"chatbot/*" = ["E501"]
# The MERIDIAN-shaped fixture embeds the live console's table-soup markup.
"fixture/meridian.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/hands", "fixture", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
