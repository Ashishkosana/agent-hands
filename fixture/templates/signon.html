{% extends "base.html" %}
{% block content %}
<h3>Operator Sign On</h3>
<form method="post" action="/signon">
<table border="1" cellpadding="4" cellspacing="0" bordercolor="#9AA8B8" bgcolor="#FFFFFF" style="min-width: 340px;">
<tr>
<td colspan="2" bgcolor="#DDE4EC" style="background: #DDE4EC; border-bottom: 1px solid #9AA8B8; padding: 6px 10px;"><b>Session</b></td>
</tr>
<tr>
<td bgcolor="#F4F7FA" style="background: #F4F7FA; color: #33475C; width: 110px;">Operator ID</td>
<td><input name="o1" size="20"></td>
</tr>
<tr>
<td bgcolor="#F4F7FA" style="background: #F4F7FA; color: #33475C;">Password</td>
<td><input name="o2" type="password" size="20"></td>
</tr>
<tr>
<td bgcolor="#F4F7FA" style="background: #F4F7FA; color: #33475C;">Branch</td>
<td>
<select name="o3">
<option value=""></option>
{% for branch in branches %}
<option value="{{ branch }}">{{ branch }}</option>
{% endfor %}
</select>
</td>
</tr>
<tr>
<td bgcolor="#F4F7FA" style="background: #F4F7FA;">&nbsp;</td>
<td><input type="submit" value="Sign On"></td>
</tr>
</table>
</form>
{% if err %}
<br>
<table border="1" cellpadding="4" cellspacing="0" bordercolor="#C08484" bgcolor="#FFFFFF" style="border: 1px solid #C08484; border-left: 4px solid #A33A3A; min-width: 340px;">
<tr>
<td bgcolor="#F3DCDC" style="background: #F3DCDC; border-bottom: 1px solid #C08484; padding: 6px 10px;"><b style="color: #7C2B2B;">Sign-on failed</b></td>
</tr>
<tr>
<td style="color: #5A2626;">Operator ID or password is not recognized.</td>
</tr>
</table>
{% endif %}
{% endblock %}
